<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../src/styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="logo-badge">SM</div>
        <h1 class="auth-title text-center">Sign in</h1>
        <p class="auth-subtitle text-center">Access your SMM and TTS dashboard</p>
        <form class="form-stack" action="./dashboard.html" method="get">
          <div class="field">
            <label>Email</label>
            <input class="input" type="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label>Password</label>
            <input class="input" type="password" placeholder="password" required />
          </div>
          <button class="btn btn-primary" type="submit">Sign in</button>
        </form>
        <p class="auth-footer">No account? <a href="./register.html">Create one</a></p>
      </div>
    </div>
  </body>
</html>
