{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    {% comment %} alert {% endcomment %}
    {% if messages %}
      <div class="alert-container">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    
    <div class="auth-shell">
      <div class="auth-card">
        <div class="logo-badge">SM</div>
        <h1 class="auth-title text-center">Verify Email</h1>
        <p class="auth-subtitle text-center">Access your SMM and TTS dashboard</p>
        <form class="form-stack" method="post">
          {% csrf_token %}
          <div class="field">
            <label>New Password</label>
            <input class="input" type="password" name="new_password" placeholder="Enter your new password" required />
          </div>
          <div class="field">
            <label>Confirm Password</label>
            <input class="input" type="password" name="confirm_password" placeholder="Confirm your new password" required />
          </div>
          <button class="btn btn-primary">Reset Password</button>
        </form>
        <p class="auth-footer">Incorrect email? <a href="{% url "edit_email" %}">Edit Email</a></p>
      </div>
    </div>

    <script type="module" src="{% static "js/index.js" %}"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script  src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
