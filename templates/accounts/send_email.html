{% extends "partials/base.html" %} {% load static %}
{% block content %}
<style>
    .success-body {
        text-align: center;
        padding: 40px 0;
        background: #0F0F0F;
    }
    .success-body h1 {
        color: #FBBF24;
        font-family: "Nunito Sans", "Helvetica Neue", sans-serif;
        font-weight: 900;
        font-size: 40px;
        margin-bottom: 10px;
    }
    .success-body p {
        color: #D1D5DB;
        font-family: "Nunito Sans", "Helvetica Neue", sans-serif;
        font-size: 20px;
        margin: 0;
    }
    .success-body i {
        color: #FBBF24;
        font-size: 100px;
        line-height: 200px;
        margin-left: -15px;
    }
    .success-body .card {
        background: #1F2937;
        padding: 60px;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
        display: inline-block;
        margin: 0 auto;
    }
</style>
<div class="auth-shell">
  <div class="auth-card">
    <div class="logo-badge">
      <img src="{% static "img/logo.png" %}" alt="Boostivon Logo" />
    </div>
    <h1 class="auth-title text-center">
        Send Bulk Email
    </h1>
    <br><br>
    {% comment %} <p class="auth-subtitle text-center">Start placing orders in minutes</p> {% endcomment %}
    <div class="form-stack">
      <div class="field">
        <label>Subject</label>
        <input type="text" name="subject" class='input' required>
        </div>
      <div class="field">
        <label>Body</label>
        <textarea name="body" id="body" cols="30" rows="10" class='input' style='resize:none;' required></textarea>
    </div>
      
      <button class="btn btn-primary" id="send_bulk_email">
        Send Email
      </button>
    </div>
    {% comment %} <p class="auth-footer">Already registered? <a href="{% url "login" %}">Sign in</a></p> {% endcomment %}
  </div>
</div>
{% endblock content %}
