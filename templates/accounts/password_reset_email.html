{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boostivon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="email-container">
        <div class="email-card">
            <h1 class="email-title">Reset Your Password</h1>
            <p class="email-subtitle">Click the button below to reset your password for your Boostivon account.</p>
            <a href="{{ reset_token }}" class="email-btn">Reset Password</a>
            <p class="email-footer">If you did not request a password reset, please ignore this email.</p>
        </div>
    </div>

</body>
</html>
