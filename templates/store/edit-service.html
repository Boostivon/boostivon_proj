{% extends "partials/base.html" %}
{% load static %}
{% block title %}Edit Service{% endblock title %}
{% block content %}
<div class="page-header">
  <h1>Edit Service</h1>
  <p>Update service information</p>
</div>

<div style="height:12px"></div>

<div class="card pad">
  <form method="POST">
    {% csrf_token %}
    <div class="form-stack">
      {{ form.as_p }}
      <div style="height:12px"></div>
      <button class="btn btn-primary" type="submit">Save Changes</button>
      <a class="btn btn-outline" href="{% url 'store:service_list' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock content %}
